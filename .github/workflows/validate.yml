name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills
        run: scripts/validate-skills.sh
      - name: Check ChatGPT packaging
        run: scripts/package-chatgpt.sh
